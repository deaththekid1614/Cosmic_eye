[project]
name = "cosic-eye-backend"
version = "0.1.0"
description = "Cosic Eye backend API for exploring NASA SPHEREx observations."
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
